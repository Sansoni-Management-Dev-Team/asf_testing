name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      repeat_each:
        description: Number of times to repeat each test
        type: number
        default: 10

permissions:
  contents: read

env:
  APP_URL: https://asf.sandbox.nationalsalescentre.com.au/
  REPEAT_EACH: ${{ inputs.repeat_each }}

jobs:
  donation:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run donation test
        run: npm run test:donation -- --repeat-each="$REPEAT_EACH"

  executive:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run executive donation test
        run: npm run test:executive -- --repeat-each="$REPEAT_EACH"
